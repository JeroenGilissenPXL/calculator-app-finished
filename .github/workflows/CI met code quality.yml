name: CI met code quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '20'
      - run: npm install
      - run: npm test -- --coverage

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '20'
      - run: npm install
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Security audit
        run: npm audit --audit-level=high
