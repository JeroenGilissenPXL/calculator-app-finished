name: Test Deployment

on: workflow_dispatch

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest image
        run: docker pull jeroengpxl/calculator-app:latest

      - name: Stop running containers
        run: docker ps -q | xargs -r docker stop

      - name: Run latest container
        run: docker run -d -p 3000:5000 jeroengpxl/calculator-app:latest
