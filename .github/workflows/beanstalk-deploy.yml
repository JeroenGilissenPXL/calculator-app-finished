name: Beanstalk Deployment

on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create deployment package
        run: zip -r deploy.zip . -x "*.git*" "docker-compose.yml"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v23
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          application_name: calculator-app
          environment_name: Calculator-app-env-1
          version_label: calculator-${{ github.run_number }}-${{ github.run_attempt }}
          region: us-east-1
          deployment_package: deploy.zip
