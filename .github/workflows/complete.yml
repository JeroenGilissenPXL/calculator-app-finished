name: Build Example

on:
  push:
    branches:
      - main

jobs:
  builds:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Setup Node.js environment
      uses: actions/setup-node@v7.1.0
    - name: Verification
      run: ls -alhR
    - name: Build the code
      run: |
        npm install
        zip -r app.zip . -x ".git/*"
    - name: Test the code
      run: npm test
    - name: Better Test Reports Action
      uses: mridang/action-test-reporter@v1.7.0
